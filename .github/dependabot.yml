version: 2
updates:
  # Bun is the canonical package manager (bun.lock); CI runs
  # `bun install --frozen-lockfile`, so Dependabot must update bun.lock.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Automatically create pull requests when vulnerabilities are found
    open-pull-requests-limit: 10
    # Grouped updates
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
    # Security updates take priority
    labels:
      - "dependencies"
      - "security"
    # Pull request options
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "jxoesneon"
