version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Automatically create pull requests when vulnerabilities are found
    open-pull-requests-limit: 10
    # Grouped updates
    groups:
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
production-dependencies:
        dependency-type: "production"
    # Security updates take priority
    labels:
      - "dependencies"
      - "security"
    # Pull request options
    pull-request-branch-name:
      separator: "/"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "jxoesneon"
    # Allow Dependabot to update package-lock.json
    versioning-strategy: increase
